# =============================================================================
# Test Suite Template
# =============================================================================
# Location: your-project/evals/test_suites/my_agent_tests.yaml
#
# Setup:
#   1. Copy this template to your project's evals/test_suites/ directory
#   2. Rename to match your agent (e.g., chat_agent_tests.yaml)
#   3. Customize the test cases for your agent's behavior
#   4. Run: python evals/run_evals.py
#
# =============================================================================

# Unique identifier for this test suite
id: my_agent_v1

# Human-readable name
name: My Agent Tests

# Version (for tracking changes)
version: "1.0"

# Description of what this test suite validates
description: |
  Test suite for validating [YOUR AGENT NAME].
  Tests [describe categories: happy path, edge cases, error handling, etc.]

# Agent name (for reporting)
agent_name: my_agent

# Author/team
author: Your Name

# Tags for filtering/organization
tags:
  - production
  - core_functionality

# =============================================================================
# CONFIGURATION
# =============================================================================
config:
  # Overall pass rate required (0-100)
  pass_threshold: 75.0

  # Evaluators to use:
  # - tool_use: FREE, validates correct tool/function calls
  # - model_judge: Uses Haiku for semantic quality evaluation
  evaluators:
    - tool_use
    - model_judge

  # Per-test timeout in seconds
  timeout_seconds: 30

  # Run tests in parallel
  parallel: true
  max_concurrent: 5

  # Retry failed tests (useful for flaky tests)
  retry_failed: false

  # How much each evaluator contributes to final score (must sum to 1.0)
  evaluator_weights:
    tool_use: 0.4
    model_judge: 0.6

# =============================================================================
# TEST CASES
# =============================================================================
test_cases:

  # ---------------------------------------------------------------------------
  # HAPPY PATH TESTS - Normal expected behavior
  # ---------------------------------------------------------------------------

  - id: happy_path_basic
    category: happy_path
    description: Basic functionality test with typical input
    difficulty: easy
    tags: [basic, sanity_check]

    # Input passed to your agent function
    input:
      # ↓↓↓ CUSTOMIZE: Your agent's input parameters ↓↓↓
      query: "Example user query"
      context: "Any additional context"

    # Expected behavior for evaluators
    expected:
      # ↓↓↓ CUSTOMIZE: Tool that should be called ↓↓↓
      tool_called: your_tool_name
      required_args:
        - query
        - context
      evaluation_criteria: |
        The agent should:
        1. Correctly interpret the query
        2. Return a relevant response
        3. [Add your specific criteria]

    # Ground truth for scoring (optional but recommended)
    ground_truth:
      # Score ranges, key matches, etc.
      ideal_score_range: [80, 100]
      key_matches:
        - expected behavior 1
        - expected behavior 2

  - id: happy_path_complex
    category: happy_path
    description: More complex happy path scenario
    difficulty: normal
    tags: [complex]

    input:
      query: "Complex multi-part query"
      options:
        include_details: true
        format: "json"

    expected:
      tool_called: your_tool_name
      required_args: [query]
      evaluation_criteria: |
        Should handle complex input with options correctly.

    ground_truth:
      ideal_score_range: [75, 95]

  # ---------------------------------------------------------------------------
  # EDGE CASE TESTS - Boundary conditions and unusual inputs
  # ---------------------------------------------------------------------------

  - id: edge_case_empty_input
    category: edge_case
    description: Handle empty or minimal input gracefully
    difficulty: normal
    tags: [validation, empty_input]

    input:
      query: ""

    expected:
      tool_called: your_tool_name
      evaluation_criteria: |
        Should handle empty input gracefully.
        May return error message or default response.
        Should NOT crash or return undefined behavior.

    ground_truth:
      ideal_score_range: [60, 80]

  - id: edge_case_long_input
    category: edge_case
    description: Handle very long input
    difficulty: normal
    tags: [validation, long_input]

    input:
      query: "This is a very long input that exceeds normal length. [Add more text to simulate your actual long input scenarios]"

    expected:
      tool_called: your_tool_name
      evaluation_criteria: |
        Should handle long input without truncation errors.
        Response should still be relevant and complete.

    ground_truth:
      ideal_score_range: [70, 90]

  # ---------------------------------------------------------------------------
  # ERROR HANDLING TESTS - Invalid inputs and error scenarios
  # ---------------------------------------------------------------------------

  - id: error_missing_required_field
    category: error_handling
    description: Handle missing required field
    difficulty: normal
    tags: [error, validation]

    input:
      # Deliberately missing required field
      optional_field: "value"

    expected:
      tool_called: your_tool_name
      evaluation_criteria: |
        Should detect missing required field.
        Should return helpful error message.
        Should NOT hallucinate values for missing field.

    ground_truth:
      ideal_score_range: [0, 30]
      forbidden_content:
        - hallucinated values

  - id: error_invalid_format
    category: error_handling
    description: Handle malformed input
    difficulty: normal
    tags: [error, validation]

    input:
      query: 12345  # Wrong type (number instead of string)

    expected:
      tool_called: your_tool_name
      evaluation_criteria: |
        Should handle type errors gracefully.
        Should provide meaningful error message.

    ground_truth:
      ideal_score_range: [0, 40]

  # ---------------------------------------------------------------------------
  # QUALITY TESTS - Evaluate response quality
  # ---------------------------------------------------------------------------

  - id: quality_relevance
    category: quality
    description: Response should be relevant to the query
    difficulty: normal
    tags: [quality, relevance]

    input:
      query: "Specific question about [topic]"

    expected:
      tool_called: your_tool_name
      evaluation_criteria: |
        Response must directly address the query.
        Should not include unrelated information.
        Relevance score should be high.

    ground_truth:
      ideal_score_range: [80, 100]

  - id: quality_accuracy
    category: quality
    description: Response should be factually accurate
    difficulty: hard
    tags: [quality, accuracy]

    input:
      query: "Query requiring factual answer"

    expected:
      tool_called: your_tool_name
      evaluation_criteria: |
        Response must be factually correct.
        Should cite sources when available.
        Should acknowledge uncertainty when appropriate.

    ground_truth:
      ideal_score_range: [85, 100]
      key_matches:
        - correct fact 1
        - correct fact 2
