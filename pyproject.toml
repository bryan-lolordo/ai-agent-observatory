[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-observatory"
version = "0.4.0"
description = "Production-ready observability platform for AI agents and LLM applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Bryan LoLordo"}
]
keywords = [
    "ai",
    "llm",
    "monitoring",
    "observability",
    "optimization",
    "machine-learning",
    "openai",
    "azure",
    "anthropic",
    "fastapi",
    "react",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core SDK
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    # API Server
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    # Data Processing
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    # Token Counting
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
# AI providers for LLM Judge and advanced features
ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
]
# Semantic caching with vector similarity
semantic = [
    "chromadb>=0.4.0",
]
# Full installation (SDK + AI + Semantic)
full = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "chromadb>=0.4.0",
]
# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
# PostgreSQL support (instead of SQLite)
postgres = [
    "psycopg2-binary>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/bryan-lolordo/ai-agent-observatory"
Documentation = "https://github.com/bryan-lolordo/ai-agent-observatory#readme"
Repository = "https://github.com/bryan-lolordo/ai-agent-observatory"
Issues = "https://github.com/bryan-lolordo/ai-agent-observatory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["observatory*", "api*"]

[tool.setuptools.package-data]
observatory = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API endpoint tests",
    "slow: Slow running tests",
]
